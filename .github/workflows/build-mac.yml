name: Build macOS App

# Manual trigger only — go to the "Actions" tab on GitHub and click "Run workflow"
on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build app (Vite/Electron bundle)
        run: npm run build

      - name: Build macOS DMG (x64 + arm64)
        run: npx electron-builder --mac --x64 --arm64 --publish=never
        env:
          # Prevents electron-builder from trying to auto-sign/notarize
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schoolflow-mac-dmg
          path: release/*.dmg
          retention-days: 30

      - name: Simulate download quarantine flag
        run: |
          # When a real user downloads a DMG from the internet, macOS (via the browser)
          # attaches this same quarantine attribute. We add it manually here to
          # accurately reproduce what your client will experience.
          xattr -w com.apple.quarantine "0181;00000000;Safari;" release/schoolFlow-1.0.0-arm64.dmg
          xattr -l release/schoolFlow-1.0.0-arm64.dmg

      - name: Mount DMG (x64)
        run: |
          hdiutil attach release/schoolFlow-1.0.0-x64.dmg -mountpoint /Volumes/schoolFlow-x64 -nobrowse
          ls -la /Volumes/schoolFlow-x64

      - name: Attempt to launch WITHOUT bypass (expected to fail/warn)
        continue-on-error: true
        run: |
          cp -R "/Volumes/schoolFlow-x64/schoolFlow.app" /Applications/
          xattr -w com.apple.quarantine "0181;00000000;Safari;" /Applications/schoolFlow.app
          echo "Attempting launch with quarantine flag still present (this should fail, proving Gatekeeper blocks it):"
          open -W /Applications/schoolFlow.app || echo "Launch blocked as expected (Gatekeeper working as documented)"

      - name: Apply the bypass command (what we'll tell the client to run)
        run: |
          xattr -cr /Applications/schoolFlow.app
          echo "Quarantine flag removed. Verifying:"
          xattr -l /Applications/schoolFlow.app || echo "No extended attributes remain — clean"

      - name: Launch app after bypass (should succeed)
        run: |
          open -a /Applications/schoolFlow.app
          sleep 8
          echo "Checking if app process is running:"
          ps aux | grep -i schoolflow | grep -v grep
          echo "Taking a screenshot for visual confirmation:"
          screencapture -x /tmp/schoolflow-launch.png || echo "Screenshot failed (may be headless/no display)"

      - name: Upload launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-screenshot
          path: /tmp/schoolflow-launch.png
          if-no-files-found: ignore

      - name: Unmount DMG
        if: always()
        run: hdiutil detach /Volumes/schoolFlow-x64 || true
