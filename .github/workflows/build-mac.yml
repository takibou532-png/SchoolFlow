name: Build macOS App

# Manual trigger only — go to the "Actions" tab on GitHub and click "Run workflow"
on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build app (Vite/Electron bundle)
        run: npm run build

      - name: Build macOS DMG (x64 + arm64)
        run: npx electron-builder --mac --x64 --arm64 --publish=never
        env:
          # Prevents electron-builder from trying to auto-sign/notarize
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schoolflow-mac-dmg
          path: release/*.dmg
          retention-days: 30
